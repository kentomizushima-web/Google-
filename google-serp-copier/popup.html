<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google SERP Copier</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">

    <!-- ヘッダー -->
    <h1>Google SERP Copier</h1>

    <!-- 検索キーワード入力欄 -->
    <div class="field">
      <label for="keyword">検索キーワード</label>
      <input type="text" id="keyword" placeholder="例: SEOツール おすすめ" />
    </div>

    <!-- 取得順位の範囲指定 -->
    <div class="field field-row">
      <div class="field-half">
        <label for="startRank">取得開始順位</label>
        <input type="number" id="startRank" value="1" min="1" max="1000" />
      </div>
      <div class="field-half">
        <label for="endRank">取得終了順位</label>
        <input type="number" id="endRank" value="50" min="1" max="1000" />
      </div>
    </div>

    <!-- 操作ボタン -->
    <div class="button-row">
      <button id="fetchBtn">URLを取得</button>
      <button id="copyBtn" disabled>クリップボードにコピー</button>
    </div>

    <!-- 進捗表示（取得中のみ表示） -->
    <div id="progress" class="hidden">
      <span class="spinner"></span>
      <span id="progressText">取得中...</span>
    </div>

    <!-- ステータスメッセージ（成功・エラー通知） -->
    <div id="status" class="hidden"></div>

    <!-- 取得結果のURL一覧 -->
    <div id="resultArea" class="hidden">
      <div class="result-header">
        <span id="resultCount"></span>
      </div>
      <ul id="urlList"></ul>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
